{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <div class="auth-left">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to manage your properties,
            inquiries and real estate activities.
        </p>

    </div>

    <div class="auth-card">

        <h2>
            Login
        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>

        <div class="bottom-text">

            Don’t have an account?

            <a href="/signup/">
                Signup
            </a>

        </div>

    </div>

</div>

{% endblock %}
