{% extends 'base.html' %}

{% block content %}

<div style="padding:40px">

    <h1>Registered Users</h1>

    <table border="1" cellpadding="10">

        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Date Joined</th>
        </tr>

        {% for user in users %}

        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.date_joined }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
